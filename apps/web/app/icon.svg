<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="atelier-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square with Gradient & Border -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#atelier-grad)" stroke="rgba(255,255,255,0.25)" stroke-width="1.2"/>
  
  <!-- Atelier ✦ Monogram Star -->
  <path 
    d="M16 6.5 C16 11.5 11.5 16 6.5 16 C11.5 16 16 20.5 16 25.5 C16 20.5 20.5 16 25.5 16 C20.5 16 16 11.5 16 6.5 Z" 
    fill="#FFFFFF" 
    filter="url(#glow)"
  />
</svg>
